name: Kontrola zdrojového kódu

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntaxe
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: RouterOS API odpovědi
        run: |
          php tests/api_client_reply_test.php
          php tests/log_archive_flow_test.php
          php tests/schema_migration_test.php
          php tests/job_processor_compatibility_test.php
          php tests/connection_event_parser_test.php

      - name: Shell syntaxe
        run: |
          sh -n install.sh
          sh -n bin/install-github-cli.sh
          sh -n bin/install-monitoring.sh
          sh -n bin/apply-update.sh
          grep -q 'php-intl' install.sh
          grep -q 'systemctl restart apache2.service' install.sh
          grep -q 'nprobe@none.service' bin/install-monitoring.sh
          grep -q 'nprobe@none.service' bin/apply-update.sh

      - name: Ochrana lokálních dat
        run: |
          test ! -e config/local.php
          test -z "$(find storage -type f ! -name .gitkeep -print -quit)"
          test -z "$(find . -type f \( -name '*.sqlite' -o -name '*.sqlite-wal' -o -name '*.sqlite-shm' \) -print -quit)"
