# WiFi Manager – vzdálený syslog/CEF. Soubor instaluje bin/install-monitoring.sh.
module(load="imtcp")
module(load="imudp")

template(name="WfmDailyFile" type="string"
         string="/var/lib/wifimanager/syslog/%$YEAR%/%$MONTH%/%$DAY%/events.jsonl")
template(name="WfmJsonLine" type="string" string="%jsonmesg%\n")

ruleset(name="wfmRemote") {
    action(type="omfile"
           dynaFile="WfmDailyFile"
           template="WfmJsonLine"
           createDirs="on"
           dirCreateMode="0750"
           dirOwner="root"
           dirGroup="www-data"
           fileCreateMode="0640"
           fileOwner="root"
           fileGroup="www-data"
           closeTimeout="5"
           asyncWriting="on"
           flushInterval="2")
    stop
}

input(type="imtcp" address="@@LISTEN_ADDRESS@@" port="@@SYSLOG_TCP_PORT@@" ruleset="wfmRemote")
input(type="imudp" address="@@LISTEN_ADDRESS@@" port="@@SYSLOG_UDP_PORT@@" ruleset="wfmRemote")
